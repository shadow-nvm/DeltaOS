# DeltaOS installer configuration.
# Syntax is YAML 1.2. Structure follows Debian's tested calamares-settings-debian
# sequence (same module order, same phases) with DeltaOS branding substituted,
# so a known-good installer flow is preserved rather than invented.
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
# Phase 1 - prepare: view pages the user fills in.
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

# Phase 2 - install: jobs that actually write the system.
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount

# Phase 3 - postinstall.
- show:
  - finished

# Branding component directory (must contain branding.desc).
branding: deltaos

prompt-install: false
dont-chroot: false
