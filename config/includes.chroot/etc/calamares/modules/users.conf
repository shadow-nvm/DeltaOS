# DeltaOS user creation: standard Debian groups, no root password prompt.
---
userGroup:       users
defaultGroups:
    - cdrom
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    nonempty: true
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8
        - minclass=3

doAutologin:     false
doReusePassword: false
