# DeltaOS welcome page.
#
# The URL buttons are off because DeltaOS has no public site yet: an enabled
# button with an empty URL is worse than no button. Turn these back on together
# with productUrl/supportUrl in branding.desc once those addresses exist.
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false

requirements:
    requiredStorage:    12
    requiredRam:        1.5
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
