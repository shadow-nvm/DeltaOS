# GRUB configuration follows the Debian Calamares defaults shipped with
# calamares-settings-debian, with the DeltaOS menu timeout retained.
---
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
timeout: 5
disableRemoveOldKernels: false
installEFIFallback: true
