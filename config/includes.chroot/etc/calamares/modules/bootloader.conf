# Bootloader configuration for DeltaOS.
#
# "sb-shim" installs shim plus the Microsoft-signed GRUB that ship in the
# image, so a machine with UEFI Secure Boot enabled can boot the installed
# system without the user switching Secure Boot off. Debian's signed GRUB has
# the EFI directory name "debian" compiled in, which is why efiBootloaderId is
# set to that value (Calamares documents this requirement for Debian-derived
# distributions).
#
# On a legacy BIOS machine the module falls back to grub-install.
---
efiBootLoader: "sb-shim"
efiBootloaderId: "debian"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
timeout: 5
installEFIFallback: true
installHybridGRUB: false
